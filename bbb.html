<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: #ffffff;
            background: #334155;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .btn-highlight {
            background: #0284c7;
        }

        .btn-highlight:hover {
            background: #38bdf8;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Thay link ảnh avatar của bạn vào đây -->
        <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Lucky" alt="Avatar">
        
        <!-- Thay tên và mô tả của bạn -->
        <h1>Xin chào, mình là Bạn 👋</h1>
        <p class="bio">Chào mừng bạn đến với trang web cá nhân được host miễn phí trên GitHub Pages của mình!</p>

        <!-- Các liên kết của bạn -->
        <div class="links">
            <a href="https://github.com" target="_blank" class="btn btn-highlight">GitHub của tôi</a>
            <a href="https://facebook.com" target="_blank" class="btn">Facebook</a>
            <a href="mailto:example@gmail.com" class="btn">Gửi Email cho tôi</a>
        </div>

        <footer>
            © 2024 Hosted on GitHub Pages
        </footer>
    </div>

</body>
</html>
